<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIAA at UIUC - Redirecting</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #478ac9 0%, #2c5aa0 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 500px;
        }
        
        h1 {
            color: #333;
            margin: 0 0 20px 0;
            font-size: 28px;
        }
        
        p {
            color: #666;
            font-size: 18px;
            line-height: 1.6;
            margin: 0 0 30px 0;
        }
        
        a {
            display: inline-block;
            background: #478ac9;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.3s ease;
        }
        
        a:hover {
            background: #2c5aa0;
        }
        
        .logo {
            max-width: 200px;
            height: auto;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="images/2024 AIAA Brand UIUC - logo.PNG" alt="AIAA Logo" class="logo">
        <h1>AIAA at UIUC</h1>
        <p>We have a new website, find it <a href="https://uiucaiaa.com/">HERE</a></p>
    </div>
</body>
</html>
